name: Host Python CI & Syntax Verification

on:
  push:
    branches: [ master, feat/**, fix/** ]
  pull_request:
    branches: [ master ]

jobs:
  host-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Host Python Dependencies
        run: |
          pip install numpy pyyaml

      - name: Note on QNX 8.0 Target Build
        run: |
          echo "Note: QNX Neutrino 8.0 target compilation (qcc -Vgcc_ntox86_64) and mkqnximage require proprietary BlackBerry QNX SDP 8.0 licenses and are executed locally (QNX 빌드는 로컬)."

      - name: Python Syntax Check (py_compile)
        run: |
          python -m py_compile \
            run_safepulse.py \
            specs/test_protocol_and_logic.py \
            specs/test_cli_verification.py \
            host/bridge/qnx_bridge.py \
            host/replay/can_replay.py \
            host/replay/run_real_data_soak.py \
            host/tools/safepulse_cli.py \
            host/test_starvation_soak.py \
            host/test_comprehensive_e2e.py \
            host/test_chaos_marathon.py \
            host/test_e2e_streaming.py \
            guest/qemu_vm/launch_qemu_daemon.py \
            guest/qemu_vm/qemu_supervisor.py \
            tools/deepseek_reviewer.py \
            tools/deepseek_final_evaluation.py \
            tools/run_deepseek_audit_loop.py

      - name: Dashboard Frontend Syntax Check (node --check)
        run: |
          node --check host/dashboard/app.js

      - name: Run Host Wire Protocol & Logic Unit Tests
        run: |
          python specs/test_protocol_and_logic.py

      - name: Run SafePulse CLI Linter Engine Unit Tests
        run: |
          python specs/test_cli_verification.py

      - name: Run SafePulse CLI Trace Verification Check (Positive & Negative)
        run: |
          python host/tools/safepulse_cli.py check examples/sample_trace.json --rules rules.yaml
          python host/tools/safepulse_cli.py check examples/sample_trace.json --rules rules.json
          python host/tools/safepulse_cli.py check examples/sample_trace.json --rules examples/custom_rules/truck_rules.yaml
          # Negative fault trace must detect violations and exit with non-zero (exit 1 expected)
          ! python host/tools/safepulse_cli.py check examples/fault_trace.json --rules rules.json
